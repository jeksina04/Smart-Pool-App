name: flutter_skeleton
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  dio: ^5.8.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  ez_localization: ^1.1.1

  # util
  flutter_screenutil: ^5.9.3
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.3
  in_app_review: ^2.0.9
  url_launcher: ^6.3.1
  geocoding: ^3.0.0
  package_info_plus: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0

flutter_gen:
  integrations:
    flutter_svg: true
  colors:
    inputs:
      - assets/values/colors.xml

flutter:

  uses-material-design: true

  assets:
    - assets/languages/
    - assets/drawables/
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
    - family: Gotham
      fonts:
        - asset: assets/fonts/Gotham-Rounded-Medium.ttf
